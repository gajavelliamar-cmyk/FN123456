<!DOCTYPE html>
<html>
    <head>
        <title>Pseudo class</title>
        <style>
        p:first-child{
            background-color: blue;
            color: white;
        }
        p:last-child{
            background-color: yellow;
             color:black;
        }
        p:last-child(2){
              background-color: pink;
              color:white
        }
        p:hover{
            background-color: aqua;
        }
        p:not(.special){
            color: pink;
        }
        
        </style>
    </head>
 <body>
    <p>FNS-1</p>
    <p>FNS-2</p>
    <p>FNS-3</p>
    <p>FNS-4</p>
    <p>FNS-5</p>
    <p>FNS-6</p>
    <p class="special">FNS-7</p>
    <p>FNS-8</p>
    <p>FNS-9</p>
    <p>FNS-10</p>

 </body>
