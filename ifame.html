<!DOCTYPE html>
<html>
<head>
    <title>Iframe Element</title>

    <style>
        iframe {
            width: 300px;
            height: 300px;
            border: 1px solid gray;
            padding: 20px;
            border-radius: 20px;
            box-sizing: border-box;
            margin: 10px;
        }
    </style>
</head>

<body>

    <!-- Google Maps -->
    <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3617.8659571508947!2d78.38094200000002!3d17.4504634!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bcb934345d35d93%3A0x4ea384e5a9a39b3a!2sExcelR!5e1!3m2!1sen!2sin!4v1786948837795!5m2!1sen!2sin">
    </iframe>

    <!-- YouTube -->
    <iframe
        src="https://www.youtube.com/embed/zEU2EdN0uIM?si=odgnXhjx7kcP9iKU"
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
    </iframe>
