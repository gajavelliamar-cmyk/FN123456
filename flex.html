<!DOCTYPE html>
<html>

<head>
    <title>CSS Flex</title>
 <style>
 .Parent{
    display: flex;
    gap:20px;
    justify-content: flex-start;

 }
 .common{
        width:100px;
        height:100px;
        border:1px solid gray;
        color: white;
        font-weight: bold;

 }
 .c1{
 background-color:red;
 }
 .c2{
    background-color: green;
 }
.c3{
   background-color: aqua;
}
 </style>

</head>
<body>
    <nav class="Parent">
    <nav class="common c1">C1</nav>
    <nav class="common c2">C2</nav>
    <nav class="common c3">C3</nav>
</nav>

</body>

</html>
