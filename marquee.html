<!DOCTYPE html>
<html>
 <head>
      <title>Marquee Tags</title>

 </head>
 <body>
    <h2><Marquee>Finshing School</Marquee></h2>
     <h2><marquee direction="left">Finshing School</marquee></h2>
   <!----> <h2><marquee direction="right">Finshing School</marquee></h2>
    <h2><Marquee direction="up">Finshing School</Marquee></h2>
    <h2><Marquee direction="down">Finshing School</Marquee></h2>
    <h2><marquee scrollamount="50">Finshing School</marquee></h2>
    <h2><marquee width="70%"></marquee></h2>
 </body>


</html>
